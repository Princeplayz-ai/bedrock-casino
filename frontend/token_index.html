<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Bedrock Casino — Dice Demo (Token)</title>
  <style>
    body{font-family: Arial, Helvetica, sans-serif; padding:24px}
    .card{max-width:600px;margin:0 auto;padding:16px;border:1px solid #eee;border-radius:8px}
    button{padding:8px 12px}
    input{padding:8px}
  </style>
</head>
<body>
  <div class="card">
    <h2>Dice (USDT token) — Demo</h2>
    <p>Connect wallet, approve token, and place a dice bet using an ERC20 token.</p>
    <div>
      <button id="connect">Connect Wallet</button>
      <div id="account"></div>
    </div>
    <hr />
    <div>
      <label>Token contract: <input id="tokenAddr" placeholder="Token address or leave" /></label>
    </div>
    <div>
      <label>Bet amount (token decimals): <input id="betAmount" type="number" step="0.0001" value="10" /></label>
    </div>
    <div>
      <label>Chance (1-98): <input id="chance" type="number" min="1" max="98" value="50" /></label>
    </div>
    <div>
      <button id="approve">Approve</button>
      <button id="place">Place Token Bet</button>
    </div>
    <div id="status"></div>
    <hr />
    <div>
      <h4>Recent Events</h4>
      <ul id="events"></ul>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/ethers@5.7.2/dist/ethers.min.js"></script>
  <script src="token_app.js"></script>
</body>
</html>
